<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nifty Sector & Stock Relative Strength Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { text-align: center; color: #38bdf8; }
    .card { background: #1e293b; border-radius: 10px; margin-bottom: 20px; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    details { margin-top: 10px; }
    summary { font-size: 1.2rem; font-weight: bold; cursor: pointer; color: #38bdf8; padding: 10px; background: #334155; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th, td { padding: 8px 12px; text-align: center; border-bottom: 1px solid #475569; }
    th { background: #0f172a; }
    .pos { color: #4ade80; font-weight: bold; }
    .neg { color: #f87171; font-weight: bold; }
    .chart-container { height: 250px; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>NSE Thematic Sectors & Stocks Relative Strength vs Nifty 50</h1>
  
  <div class="card">
    <h2>Sector Relative Strength Overview</h2>
    <div class="chart-container"><canvas id="sectorChart"></canvas></div>
  </div>

  <div id="sectorContainer"></div>

  <script>
    const periods = ['10d', '20d', '50d', '70d', '90d', '100d', '150d', '200d'];

    async function loadDashboard() {
      const res = await fetch('data.json');
      const data = await res.json();

      // Render Sector Overview Chart
      const ctx = document.getElementById('sectorChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.map(d => d.sector),
          datasets: [{
            label: '20-Day RS (%)',
            data: data.map(d => d.sector_rs['20d']),
            backgroundColor: data.map(d => d.sector_rs['20d'] >= 0 ? '#4ade80' : '#f87171')
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // Render Sector Accordions & Tables
      const container = document.getElementById('sectorContainer');
      data.forEach((sec, idx) => {
        let html = `
          <div class="card">
            <details ${idx === 0 ? 'open' : ''}>
              <summary>${sec.sector}</summary>
              
              <h3>Sector RS Metrics</h3>
              <table>
                <thead><tr>${periods.map(p => `<th>${p}</th>`).join('')}</tr></thead>
                <tbody>
                  <tr>${periods.map(p => `<td class="${sec.sector_rs[p] >= 0 ? 'pos' : 'neg'}">${sec.sector_rs[p] ?? '-'}%</td>`).join('')}</tr>
                </tbody>
              </table>

              <h4 style="margin-top:20px;">Top Constituent Stocks</h4>
              <table>
                <thead>
                  <tr><th>Stock</th>${periods.map(p => `<th>${p}</th>`).join('')}</tr>
                </thead>
                <tbody>
                  ${sec.stocks.map(st => `
                    <tr>
                      <td><strong>${st.ticker}</strong></td>
                      ${periods.map(p => `<td class="${st.rs[p] >= 0 ? 'pos' : 'neg'}">${st.rs[p] ?? '-'}%</td>`).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>

              <div class="chart-container">
                <canvas id="chart-${idx}"></canvas>
              </div>
            </details>
          </div>
        `;
        container.innerHTML += html;
      });

      // Render Stock Charts per Sector
      setTimeout(() => {
        data.forEach((sec, idx) => {
          const sCtx = document.getElementById(`chart-${idx}`).getContext('2d');
          new Chart(sCtx, {
            type: 'line',
            data: {
              labels: periods,
              datasets: sec.stocks.map((st, i) => ({
                label: st.ticker,
                data: periods.map(p => st.rs[p]),
                fill: false,
                borderWidth: 2
              }))
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        });
      }, 100);
    }

    loadDashboard();
  </script>
</body>
</html>
